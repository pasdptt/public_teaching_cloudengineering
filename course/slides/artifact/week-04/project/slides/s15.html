<section id="s15" style="background:#f7f8fa;color:#17212d;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px 160px 160px;display:flex;flex-direction:column;justify-content:start;gap:44px"><h2 style="font-family:'IBM Plex Sans', Arial, sans-serif;font-size:64px;font-weight:600;line-height:1.12;letter-spacing:-1px;color:#17212d">Ephemeral and static</h2><div style="display:flex;flex-direction:column;align-items:start;gap:30px;flex:1"><p style="font-size:40px;line-height:1.4;color:#17212d;max-width:1380px"><span style="color:#17212d"><b>Ephemeral</b></span> — assigned when the instance starts, released when it is deleted. Changes every time.</p><p style="font-size:40px;line-height:1.4;color:#17212d;max-width:1380px"><span style="color:#17212d"><b>Static</b></span> — reserved by you, kept until you release it, survives the instance entirely.</p></div><p style="position:absolute;left:160px;bottom:64px;width:1300px;font-family:'IBM Plex Mono', 'Courier New', monospace;font-size:24px;color:#7d8898">Week 4 · Hierarchy, virtual machines, identity</p><p style="position:absolute;right:160px;bottom:64px;width:120px;text-align:right;font-family:'IBM Plex Mono', 'Courier New', monospace;font-size:24px;color:#7d8898">15</p></section>
