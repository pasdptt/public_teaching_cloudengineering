<section id="s03" style="background:#f7f8fa;color:#17212d;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px 160px 160px;display:flex;flex-direction:column;justify-content:start;gap:44px"><h2 style="font-family:'IBM Plex Sans', Arial, sans-serif;font-size:64px;font-weight:600;line-height:1.12;letter-spacing:-1px;color:#17212d">What a process is</h2><div style="display:flex;flex-direction:column;align-items:start;gap:30px;flex:1"><p style="font-size:40px;line-height:1.4;color:#17212d;max-width:1380px">A running program, plus what the OS gives it:</p><ul style="font-size:40px;line-height:1.4;color:#17212d;max-width:1380px"><li>its own view of <span style="color:#17212d"><b>memory</b></span></li><li>a set of <span style="color:#17212d"><b>open files</b></span></li><li>an <span style="color:#17212d"><b>identity</b></span></li><li>a <span style="color:#17212d"><b>number</b></span> — the process id</li></ul><p style="font-size:40px;line-height:1.4;color:#17212d;max-width:1380px">The important word is <span style="color:#5c6878"><i>own</i></span>.</p></div><p style="position:absolute;left:160px;bottom:64px;width:1300px;font-family:'IBM Plex Mono', 'Courier New', monospace;font-size:24px;color:#7d8898">Week 2 · Processes, isolation, containers</p><p style="position:absolute;right:160px;bottom:64px;width:120px;text-align:right;font-family:'IBM Plex Mono', 'Courier New', monospace;font-size:24px;color:#7d8898">3</p></section>
