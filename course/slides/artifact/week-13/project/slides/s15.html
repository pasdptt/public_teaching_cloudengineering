<section id="s15" style="background:#f7f8fa;color:#17212d;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px 160px 160px;display:flex;flex-direction:column;justify-content:start;gap:44px"><h2 style="font-family:'IBM Plex Sans', Arial, sans-serif;font-size:64px;font-weight:600;line-height:1.12;letter-spacing:-1px;color:#17212d">Configuration, or a secret?</h2><div style="display:flex;flex-direction:column;align-items:start;gap:30px;flex:1"><p style="font-size:40px;line-height:1.4;color:#17212d;max-width:1380px">A project id is configuration. A password is a secret.</p><p style="font-size:40px;line-height:1.4;color:#17212d;max-width:1380px">The test is not “is it sensitive?” but <span style="color:#17212d"><b>“what happens if this appears in a public repository?”</b></span></p></div><p style="position:absolute;left:160px;bottom:64px;width:1300px;font-family:'IBM Plex Mono', 'Courier New', monospace;font-size:24px;color:#7d8898">Week 13 · Infrastructure as code, environments, pipelines</p><p style="position:absolute;right:160px;bottom:64px;width:120px;text-align:right;font-family:'IBM Plex Mono', 'Courier New', monospace;font-size:24px;color:#7d8898">15</p></section>
