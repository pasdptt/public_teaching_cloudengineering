<section id="s22" style="background:#f7f8fa;color:#17212d;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px 160px 160px;display:flex;flex-direction:column;justify-content:start;gap:44px"><h2 style="font-family:'IBM Plex Sans', Arial, sans-serif;font-size:64px;font-weight:600;line-height:1.12;letter-spacing:-1px;color:#17212d">Three levels, not two</h2><div style="display:flex;flex-direction:column;align-items:start;gap:30px;flex:1"><ol style="font-size:40px;line-height:1.4;color:#17212d;max-width:1380px"><li><span style="color:#17212d"><b>In memory</b></span> — gone when the <span style="color:#17212d"><b>process</b></span> ends</li><li><span style="color:#17212d"><b>On disposable storage</b></span> — gone when the <span style="color:#17212d"><b>container or machine</b></span> ends</li><li><span style="color:#17212d"><b>On storage that outlives the compute</b></span> — survives both</li></ol><p style="font-size:40px;line-height:1.4;color:#17212d;max-width:1380px">Only level 3 is really state.</p></div><p style="position:absolute;left:160px;bottom:64px;width:1300px;font-family:'IBM Plex Mono', 'Courier New', monospace;font-size:24px;color:#7d8898">Week 3 · State, latency, failure</p><p style="position:absolute;right:160px;bottom:64px;width:120px;text-align:right;font-family:'IBM Plex Mono', 'Courier New', monospace;font-size:24px;color:#7d8898">22</p></section>
