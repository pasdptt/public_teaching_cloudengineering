<section id="s12" style="background:#f7f8fa;color:#17212d;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px 160px 160px;display:flex;flex-direction:column;justify-content:start;gap:44px"><h2 style="font-family:'IBM Plex Sans', Arial, sans-serif;font-size:64px;font-weight:600;line-height:1.12;letter-spacing:-1px;color:#17212d">You upload the whole gigabyte again</h2><div style="display:flex;flex-direction:column;align-items:start;gap:30px;flex:1"><p style="font-size:40px;line-height:1.4;color:#17212d;max-width:1380px">That is why:</p><ul style="font-size:40px;line-height:1.4;color:#17212d;max-width:1380px"><li>nobody puts a database <span style="color:#17212d"><b>on</b></span> object storage, and</li><li>append-only workloads write <span style="color:#17212d"><b>many small objects</b></span> instead of one growing one.</li></ul><p style="font-size:40px;line-height:1.4;color:#17212d;max-width:1380px">To “edit” an object, you write a new one.</p></div><p style="position:absolute;left:160px;bottom:64px;width:1300px;font-family:'IBM Plex Mono', 'Courier New', monospace;font-size:24px;color:#7d8898">Week 6 · Storage abstractions</p><p style="position:absolute;right:160px;bottom:64px;width:120px;text-align:right;font-family:'IBM Plex Mono', 'Courier New', monospace;font-size:24px;color:#7d8898">12</p></section>
