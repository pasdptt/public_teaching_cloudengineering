<section id="s07" style="background:#f5f3ee;color:#1b2638;font-family:'Inter', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;justify-content:start;gap:48px"><div style="display:flex;flex-direction:column;gap:16px"><div style="height:32px;display:flex;flex-direction:row;align-items:center;gap:14px"><p style="font-family:'Inter', Arial, sans-serif;font-size:24px;font-weight:700;letter-spacing:3px;text-transform:uppercase;line-height:1.3;white-space:nowrap;color:#0b5f59">02 · Ports and binding</p></div><h2 style="font-family:'Manrope', Arial, sans-serif;font-size:60px;font-weight:700;line-height:1.1;letter-spacing:-1px;color:#13213a;max-width:1600px">What a port is</h2></div><div style="display:flex;flex-direction:column;align-items:start;gap:32px;flex:1"><p style="font-family:'Inter', Arial, sans-serif;font-size:36px;line-height:1.45;color:#1b2638;max-width:1400px">A machine has an IP address. Many programs want the network at once.</p><p style="font-family:'Inter', Arial, sans-serif;font-size:36px;line-height:1.45;color:#1b2638;max-width:1400px">A <span style="color:#13213a"><b>port</b></span> is a 16-bit number that says <span style="color:#3e4a5c"><i>which program</i></span>.</p><p style="font-family:'Inter', Arial, sans-serif;font-size:36px;line-height:1.45;color:#1b2638;max-width:1400px">The OS lets <span style="color:#13213a"><b>one process at a time</b></span> listen on a given port.</p></div><div style="position:absolute;left:128px;bottom:64px;width:1664px;display:flex;flex-direction:row;justify-content:space-between"><p style="font-family:'Inter', Arial, sans-serif;font-size:24px;color:#5e6878">Week 2 · Processes, isolation, containers</p><p style="font-family:'Inter', Arial, sans-serif;font-size:24px;color:#5e6878">7</p></div></section>
