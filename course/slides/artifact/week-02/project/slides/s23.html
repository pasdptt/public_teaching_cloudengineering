<section id="s23" style="background:#f7f8fa;color:#17212d;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px 160px 160px;display:flex;flex-direction:column;justify-content:start;gap:44px"><h2 style="font-family:'IBM Plex Sans', Arial, sans-serif;font-size:64px;font-weight:600;line-height:1.12;letter-spacing:-1px;color:#17212d">Namespaces and cgroups</h2><div style="display:flex;flex-direction:column;align-items:start;gap:30px;flex:1"><p style="font-size:40px;line-height:1.4;color:#17212d;max-width:1380px">A container is a normal process with:</p><ul style="font-size:40px;line-height:1.4;color:#17212d;max-width:1380px"><li><span style="color:#17212d"><b>namespaces</b></span> — its own view of the filesystem, the process table, the network</li><li><span style="color:#17212d"><b>cgroups</b></span> — a limit on how much CPU and memory it can take</li></ul><p style="font-size:40px;line-height:1.4;color:#17212d;max-width:1380px">That is it. Linux provides exactly these.</p></div><p style="position:absolute;left:160px;bottom:64px;width:1300px;font-family:'IBM Plex Mono', 'Courier New', monospace;font-size:24px;color:#7d8898">Week 2 · Processes, isolation, containers</p><p style="position:absolute;right:160px;bottom:64px;width:120px;text-align:right;font-family:'IBM Plex Mono', 'Courier New', monospace;font-size:24px;color:#7d8898">23</p></section>
