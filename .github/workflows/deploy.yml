# Delivery pipeline — Lab 6 (week 13).
#
# INCOMPLETE ON PURPOSE. The TODO blocks are your work, and each one is a decision.
#
# What this is meant to do:
#   1. run the tests          — the gate
#   2. build the image ONCE   — tagged with the commit sha, not "latest"
#   3. deploy to dev          — automatically, on merge to main
#   4. promote to prod        — deliberately, by running the workflow by hand
#
# The same image reaches prod that was tested in dev. It is never rebuilt. A rebuild means
# deploying something you did not test, and "but the source was identical" is not the same
# claim as "the artefact was identical". So a prod run builds NOTHING: it asks Cloud Run which
# image dev is running, by digest, and deploys exactly that.
#
# OFF UNTIL LAB 6. This file is in your fork from week 3, and without the Lab 6 setup every
# run would fail at authentication -- ten weeks of red runs that mean nothing, which is the
# fastest way to teach anyone to ignore a red run. So both jobs are skipped (grey, not red)
# until you set a repository VARIABLE in your fork, in Lab 6 Part 5:
#
#     Settings -> Secrets and variables -> Actions -> Variables -> DEPLOY_ENABLED = true
#
# A variable, not a secret: it is a visible switch, and anyone reading the repository can see
# whether the pipeline is live. Contrast that with a gate quietly deleted from this file.
#
# COST: $0. Actions minutes are free on public repositories (references.md R-13). Cloud Run
# with min_instance_count = 0 costs nothing when idle (R-12). Artifact Registry is free below
# 0.5 GiB (R-10) -- which is why step 7 exists.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Which environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options: [dev, prod]

# The two permissions the pipeline needs, and no others.
#
#   contents: read    -- check out the code
#   id-token: write   -- mint a short-lived OIDC token that proves to Google Cloud
#                        "this is workflow X in repository Y, running on commit Z"
#
# That second one is the whole reason no service-account key exists anywhere in this
# repository. Google's own documentation says a key "must be treated like a password" and
# "by default, these credentials never expire" (references.md R-14). This pipeline never
# creates one.
permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false   # do not cancel a deploy halfway. Think about why.

env:
  REGION: us-central1
  REPOSITORY: docapp
  SERVICE_BASE: docapp
  # TODO(lab06): the bucket holding Terraform state, created by hand in Part 4. It
  # is configuration, not a secret -- but note that anyone who can read it can read
  # your state, and week 13 told you what state contains.
  STATE_BUCKET: ''

jobs:
  test:
    name: Test (the gate)
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r application/requirements-dev.txt
      - name: Run the test suite
        working-directory: application
        run: python -m pytest -q

  deploy:
    name: Build once, deploy to ${{ inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    # This is the gate. Without it, a failing test would not stop a deployment -- and a gate
    # you have removed is worse than no gate, because you still believe you have one.
    needs: test
    if: vars.DEPLOY_ENABLED == 'true'
    env:
      ENVIRONMENT: ${{ inputs.environment || 'dev' }}

    steps:
      - uses: actions/checkout@v4

      # --- 1. Authenticate, without a key -------------------------------------------------
      #
      # TODO(lab06): fill in the two values below from the Workload Identity Federation pool
      # created in Part 4 -- weeks/week-13/lab-06/starter/01-bootstrap-pipeline.sh prints both. Both are configuration, not secrets -- they identify a trust
      # relationship, they do not grant anything on their own. The trust only works for the
      # repository named in the pool's attribute condition, which is what makes publishing
      # them safe.
      #
      # Before you fill them in, answer this in your submission: what stops someone forking
      # this public repository and using these same values to deploy into YOUR project?
      - id: auth
        name: Authenticate to Google Cloud (keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '' # TODO(lab06): projects/NUM/locations/global/workloadIdentityPools/POOL/providers/PROVIDER
          service_account: ''            # TODO(lab06): deployer SA email

      - uses: google-github-actions/setup-gcloud@v2

      # --- 2. The artefact: built once, for dev; promoted unchanged to prod ----------------
      - name: Configure Docker for Artifact Registry
        if: env.ENVIRONMENT == 'dev'
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push the image (dev only, at most once per commit)
        id: build
        if: env.ENVIRONMENT == 'dev'
        run: |
          set -euo pipefail
          # Tagged with the commit sha. NOT "latest".
          #
          # TODO(lab06): explain in your submission why ":latest" would break the promise
          # this pipeline makes. There is a specific failure it allows that a sha tag does
          # not -- name it.
          REPO_PATH="${REGION}-docker.pkg.dev/${{ steps.auth.outputs.project_id }}/${REPOSITORY}/docapp"
          TAGGED="${REPO_PATH}:${GITHUB_SHA}"

          # Re-running the workflow on the same commit must not rebuild: a second build would
          # move the tag onto different bytes, and the tag would stop meaning anything.
          if DIGEST="$(gcloud artifacts docker images describe "$TAGGED" \
                         --format='value(image_summary.digest)' 2>/dev/null)" && [[ -n "$DIGEST" ]]; then
            echo "Already built for ${GITHUB_SHA} -- reusing it, not rebuilding."
            IMAGE="${REPO_PATH}@${DIGEST}"
          else
            docker build -t "$TAGGED" application/
            docker push "$TAGGED"
            IMAGE="$(docker inspect --format='{{index .RepoDigests 0}}' "$TAGGED")"
          fi

          # Deployed by DIGEST. The sha tag is for humans; the digest is what cannot move.
          echo "Deploying ${IMAGE}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Find the image dev is running (prod only -- nothing is built)
        id: promote
        if: env.ENVIRONMENT == 'prod'
        run: |
          set -euo pipefail
          # Promotion means: the exact bytes dev is serving right now. Ask Cloud Run for the
          # digest of dev's current revision rather than trusting a tag, which could have
          # been moved since dev was tested.
          REVISION="$(gcloud run services describe "${SERVICE_BASE}-dev" --region="$REGION" \
                        --format='value(status.latestReadyRevisionName)')"
          [[ -n "$REVISION" ]] || { echo "dev has no ready revision -- deploy dev first." >&2; exit 1; }
          IMAGE="$(gcloud run revisions describe "$REVISION" --region="$REGION" \
                     --format='value(status.imageDigest)')"
          [[ "$IMAGE" == *@sha256:* ]] || { echo "Could not read dev's image digest (got '${IMAGE}')." >&2; exit 1; }
          echo "Promoting dev's ${REVISION}: ${IMAGE}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      # --- 3. Deploy that exact artefact --------------------------------------------------
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      - name: Terraform apply
        working-directory: infra
        env:
          IMAGE: ${{ steps.build.outputs.image || steps.promote.outputs.image }}
        run: |
          set -euo pipefail

          # --- state -------------------------------------------------------------------
          #
          # TODO(lab06): this `init` configures no backend, which means LOCAL state -- and
          # a runner is a brand new machine every time. Work out what that means before you
          # fix it: PREDICT, in your submission, what a second run would try to do and how it
          # would fail. (Lab 6 is a one-week lab, so you are not asked to watch it fail.)
          #
          # Then fix it by pointing `init` at the state bucket you create in Part 4:
          #
          #   terraform init -input=false \
          #     -backend-config="bucket=${STATE_BUCKET}" \
          #     -backend-config="prefix=docapp"
          #
          # ...which also needs the backend block in infra/versions.tf uncommented, and your
          # existing local state migrated into it with `terraform init -migrate-state`.
          #
          # Two questions, and the second is the interesting one:
          #   * why can the state bucket NOT be created by this Terraform configuration?
          #   * week 13 said local state was "fine for one student on one laptop". What
          #     exactly changed? Name the new actor.
          terraform init -input=false

          # --- which environment -------------------------------------------------------
          #
          # TODO(lab06): nothing here selects a workspace, so `dev` and `prod` would share
          # one state file. Predict what a prod deploy does to dev's resources in that
          # situation -- then add:
          #
          #   terraform workspace select -or-create "$ENVIRONMENT"
          #
          # It is the same mistake the lab warns you about locally, made by a machine that
          # never thinks to run `terraform workspace show` first.

          # TODO(lab06): this runs `apply` straight away. Add a `terraform plan` step first
          # and print it, so the run's log shows WHAT changed before it changed.
          #
          # Then answer: a plan you do not read is not a safety measure. What would have to
          # be true of this pipeline for the plan to actually protect you?

          # envs/dev.tfvars and envs/prod.tfvars are COMMITTED (Lab 6 Parts 2-3). A runner is
          # a fresh machine; a variable file that exists only on your laptop does not exist here.
          terraform apply -input=false -auto-approve \
            -var-file="envs/${ENVIRONMENT}.tfvars" \
            -var="image=${IMAGE}"

          terraform output -raw service_url

      # --- 4. Confirm it is actually up ---------------------------------------------------
      - name: Smoke test the deployment
        working-directory: infra
        run: |
          set -euo pipefail
          URL="$(terraform output -raw service_url)"

          # The service is PRIVATE -- there is no allUsers binding anywhere in infra/ --
          # so an unauthenticated curl gets 403, and this step would fail every time on a
          # perfectly healthy deployment. The pipeline has an identity; it has to use it.
          #
          # --audiences matters here and does not when you do this by hand. A token minted
          # for a service account is issued FOR something, and Cloud Run checks it was
          # issued for this service.
          TOKEN="$(gcloud auth print-identity-token --audiences="$URL")"

          # TODO(lab06): this also needs the deployer account to be ALLOWED to invoke the
          # service -- the second `TODO` in infra/main.tf. If this step returns 403 rather
          # than timing out, that grant is what is missing, and a 403 here is a different
          # failure from a 503. Say which you saw.
          for i in $(seq 1 10); do
            if curl -fsS --max-time 10 -H "Authorization: Bearer $TOKEN" "$URL/healthz"; then
              echo "healthy"; exit 0
            fi
            echo "not ready yet ($i/10)"; sleep 6
          done
          echo "Service did not become healthy." >&2
          exit 1

      # TODO(lab06): the smoke test fails the RUN, but the bad revision is already serving
      # traffic. Describe, in your submission, what you would add here and what it would
      # cost you. You do not have to build it.

      # --- 5. Keep the registry inside its free allowance ---------------------------------
      # TODO(lab06): every run pushes a new image. The free Artifact Registry allowance is
      # 0.5 GiB. Add a step that deletes images older than the most recent few.
      #
      # `gcloud artifacts docker images list` and `... delete` are what you need. Bound it:
      # a cleanup step that can delete the image currently in production is worse than no
      # cleanup step at all.

      # --- One last thing to notice, and it is not a TODO ---------------------------------
      #
      # Count what the deployer service account has to be allowed to do for this file to
      # work. It creates service accounts. It grants project-level IAM. It writes to
      # Artifact Registry, administers Cloud Run, and owns two buckets and a Pub/Sub
      # topology.
      #
      # By the end of this lab the pipeline's identity is close to the most powerful
      # principal in your project -- and it acts on whatever is on the main branch.
      #
      # That is not a flaw in this design. It is what "the pipeline deploys the
      # infrastructure" means, and every team that does this lives with it. Say in your
      # submission what you would do about it: branch protection is one answer, a separate
      # plan-only identity for pull requests is another, and "nothing, and here is why that
      # is acceptable here" is defensible if you can make the argument.
