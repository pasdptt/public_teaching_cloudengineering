[pytest]
testpaths = tests
markers =
    lab01: acceptance tests for the Lab 1 FileJobStore exercise (run with: pytest -m lab01)
    lab03: acceptance tests for the Lab 3 cloud backends. These touch REAL cloud resources
        and are skipped unless DOCAPP_TEST_BUCKET / DOCAPP_TEST_PROJECT are set.
# Lab exercise tests are excluded by default so that a fresh clone has a green suite.
# Students opt into their exercise's acceptance tests explicitly.
addopts = -m "not lab01 and not lab03" --strict-markers -q
