<section id="s19" style="background:#f7f8fa;color:#17212d;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px 160px 160px;display:flex;flex-direction:column;justify-content:start;gap:44px"><h2 style="font-family:'IBM Plex Sans', Arial, sans-serif;font-size:64px;font-weight:600;line-height:1.12;letter-spacing:-1px;color:#17212d">Backoff, and jitter</h2><div style="display:flex;flex-direction:column;align-items:start;gap:30px;flex:1"><p style="font-size:40px;line-height:1.4;color:#17212d;max-width:1380px"><span style="color:#17212d"><b>Exponential backoff:</b></span> wait longer after each failure.</p><p style="font-size:40px;line-height:1.4;color:#17212d;max-width:1380px"><span style="color:#17212d"><b>Jitter:</b></span> randomise the wait.</p><p style="font-size:40px;line-height:1.4;color:#17212d;max-width:1380px">Jitter is not decoration. <span style="color:#17212d"><b>Synchronised retries are the problem</b></span>, so desynchronising them is the fix.</p></div><p style="position:absolute;left:160px;bottom:64px;width:1300px;font-family:'IBM Plex Mono', 'Courier New', monospace;font-size:24px;color:#7d8898">Week 11 · Queues and event-driven processing</p><p style="position:absolute;right:160px;bottom:64px;width:120px;text-align:right;font-family:'IBM Plex Mono', 'Courier New', monospace;font-size:24px;color:#7d8898">19</p></section>
